{% extends 'layout.html' %}
{% block title %}New task | Daymark{% endblock %}
{% block content %}
<section class="form-page">
    <a class="back-link" href="/todos/">&#8592; Back to today</a>
    <header class="form-heading">
        <p class="eyebrow">MAKE IT REAL</p>
        <h1>Add a <em>task.</em></h1>
        <p class="welcome-copy">Give your next step a name, then make space for it.</p>
    </header>
    <form class="editor-form" method="post" action="/todos/add-todo">
        <label class="field-label" for="title">Task name</label>
        <input id="title" class="text-input" type="text" name="title" maxlength="160" placeholder="What needs doing?" required>

        <label class="field-label" for="description">Details <span class="optional-label">Optional</span></label>
        <textarea id="description" class="text-input text-area" name="description" rows="4" maxlength="1000" placeholder="Add a little context"></textarea>

        <div class="field-grid">
            <div>
                <label class="field-label" for="priority">Priority</label>
                <select id="priority" class="text-input" name="priority">
                    <option value="1">Low</option>
                    <option value="2">Low to medium</option>
                    <option value="3" selected>Medium</option>
                    <option value="4">High</option>
                    <option value="5">Urgent</option>
                </select>
            </div>
            <div>
                <label class="field-label" for="due_date">Due date <span class="optional-label">Optional</span></label>
                <input id="due_date" class="text-input" type="date" name="due_date">
            </div>
        </div>
        <div class="form-actions">
            <button class="button button-dark" type="submit">Save task</button>
            <a class="button button-quiet" href="/todos/">Cancel</a>
        </div>
    </form>
</section>
{% endblock %}
