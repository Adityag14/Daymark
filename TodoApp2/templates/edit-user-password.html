{% extends 'layout.html' %}
{% block title %}Security | Daymark{% endblock %}
{% block content %}
<section class="form-page account-page">
    <a class="back-link" href="/todos/">&#8592; Back to today</a>
    <div class="auth-form-area">
        <p class="eyebrow">ACCOUNT SECURITY</p>
        <h2>Change password</h2>
        <p class="auth-subtitle">Choose a strong password you haven’t used elsewhere.</p>
        {% if msg %}<p class="alert-message" role="alert">{{ msg }}</p>{% endif %}
        <form class="auth-form" method="post" action="/users/edit-password">
            <label class="field-label" for="current-password">Current password</label>
            <input id="current-password" class="text-input" type="password" name="password" autocomplete="current-password" required>
            <label class="field-label" for="new-password">New password</label>
            <input id="new-password" class="text-input" type="password" name="new_password" autocomplete="new-password" minlength="8" required>
            <label class="field-label" for="confirm-password">Confirm new password</label>
            <input id="confirm-password" class="text-input" type="password" name="new_password_confirm" autocomplete="new-password" minlength="8" required>
            <button class="button button-dark" type="submit">Update password</button>
        </form>
    </div>
</section>
{% endblock %}
